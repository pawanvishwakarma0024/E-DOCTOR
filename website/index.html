<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E Doctor — Smart Medicine &amp; Health Platform</title>

  <!-- Tailwind (local offline copy) -->
  <script src="assets/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:    { DEFAULT:'#1a6fdb', 50:'#e8f1ff', 100:'#d1e4ff', 600:'#1558b0', 700:'#0d4090' },
            secondary:  { DEFAULT:'#535e7a', 50:'#eef0f8', 100:'#d8e2f9' },
            tertiary:   { DEFAULT:'#6a5e7e', 100:'#ebddf7' },
            error:      { DEFAULT:'#ba1a1a', 50:'#fff0ee', 100:'#ffdad6' },
            success:    { DEFAULT:'#1a7a4a', 100:'#c8f5d8' },
            warning:    { DEFAULT:'#7a5a00', 100:'#fff0c2' },
            surface: {
              DEFAULT:            '#faf8ff',
              container:          '#eeedf4',
              'container-low':    '#e8e7ef',
              'container-lowest': '#ffffff',
              'container-high':   '#e2e1e9',
            },
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"','Arial','sans-serif'] },
        }
      }
    }
  </script>

  <!-- Fonts & Icons (local offline copies — no internet needed) -->
  <link rel="stylesheet" href="assets/fonts.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-surface text-[#1b1c1f] font-sans h-full overflow-hidden">

  <!-- ══ DEMO BANNER ══════════════════════════════════════════════════════ -->
  <div id="demo-banner"
       class="fixed top-0 inset-x-0 z-[100] bg-amber-500 text-white text-xs font-semibold
              flex items-center justify-center gap-2 px-4 h-8 shadow-sm">
    <span class="material-symbols-outlined text-[16px]">warning</span>
    Demo Data Only — No real medicine verification, pricing, or medical advice
    <button onclick="document.getElementById('demo-banner').style.display='none'"
            class="ml-auto opacity-75 hover:opacity-100 text-white">✕</button>
  </div>

  <!-- ══ APP SHELL ════════════════════════════════════════════════════════ -->
  <div id="app-shell" class="flex h-full pt-8">

    <!-- ── Desktop Sidebar ──────────────────────────────────────── -->
    <aside id="sidebar"
           class="hidden lg:flex flex-col w-64 bg-surface-container-lowest border-r border-[#c4c6d0]
                  fixed top-8 bottom-0 left-0 z-40 overflow-y-auto">

      <!-- Logo -->
      <div class="flex items-center gap-3 px-5 py-5 border-b border-[#c4c6d0]">
        <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-sm flex-shrink-0">
          <span class="material-symbols-outlined text-white text-[20px]">health_and_safety</span>
        </div>
        <div>
          <div class="font-bold text-base text-[#1b1c1f] leading-tight">E Doctor</div>
          <div class="text-xs text-[#44464e]">Health Intelligence</div>
        </div>
      </div>

      <!-- Nav items -->
      <nav class="flex-1 px-3 py-4 space-y-1" id="sidebar-nav"></nav>

      <!-- User profile strip -->
      <div class="px-4 py-4 border-t border-[#c4c6d0]" id="sidebar-user"></div>
    </aside>

    <!-- ── Content Column ────────────────────────────────────────── -->
    <div class="flex flex-col flex-1 lg:ml-64 min-h-full">

      <!-- ── Mobile / Tablet Top Bar ──────────────────────────── -->
      <header id="topbar"
              class="lg:hidden flex items-center gap-3 px-4 h-14 bg-surface-container-lowest
                     border-b border-[#c4c6d0] fixed top-8 inset-x-0 z-30 shadow-sm">
        <button onclick="ED.toggleMobileSidebar()"
                class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-container">
          <span class="material-symbols-outlined text-[22px] text-[#44464e]">menu</span>
        </button>
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-white text-[16px]">health_and_safety</span>
          </div>
          <span class="font-bold text-sm text-[#1b1c1f]">E Doctor</span>
          <span class="text-[#74767e] text-xs ml-1 truncate" id="topbar-screen-title"></span>
        </div>
        <a href="tel:911"
           class="flex items-center gap-1 bg-error-100 text-error px-3 py-1.5 rounded-full text-xs font-bold">
          <span class="material-symbols-outlined text-[16px]" style="font-variation-settings:'FILL' 1">emergency</span>
          SOS
        </a>
      </header>

      <!-- ── Desktop Top Bar ───────────────────────────────────── -->
      <header id="topbar-desktop"
              class="hidden lg:flex items-center gap-4 px-6 h-14 bg-surface-container-lowest
                     border-b border-[#c4c6d0] fixed top-8 left-0 lg:left-64 right-0 z-30 shadow-sm">
        <div class="text-sm text-[#44464e] flex-1" id="desktop-breadcrumb"></div>
        <!-- Global search -->
        <div class="flex items-center gap-2 bg-surface-container rounded-xl px-3 h-9 w-72">
          <span class="material-symbols-outlined text-[18px] text-[#74767e]">search</span>
          <input placeholder="Search medicine, symptom…"
                 class="bg-transparent text-sm w-full focus:outline-none text-[#1b1c1f] placeholder:text-[#74767e]"
                 id="desktop-search">
        </div>
        <a href="tel:911"
           class="flex items-center gap-1.5 bg-error-100 text-error px-4 py-2 rounded-full text-sm font-bold hover:bg-red-200 transition-colors">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">emergency</span>
          Emergency SOS
        </a>
        <button onclick="ED.navigate('profile')"
                class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm shadow-sm">
          SJ
        </button>
      </header>

      <!-- ── Main Content ──────────────────────────────────────── -->
      <main id="main-content"
            class="flex-1 overflow-y-auto pt-14 pb-20 lg:pb-6">
        <!-- Screen HTML injected here -->
      </main>

      <!-- ── Mobile Bottom Nav ─────────────────────────────────── -->
      <nav id="bottom-nav"
           class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-surface-container-lowest
                  border-t border-[#c4c6d0] flex items-stretch h-16 safe-bottom shadow-[0_-1px_6px_rgba(0,0,0,0.06)]">
      </nav>

    </div><!-- /content column -->

    <!-- ── Mobile Sidebar Overlay ───────────────────────────────── -->
    <div id="mobile-overlay"
         class="hidden fixed inset-0 bg-black/40 z-40 lg:hidden"
         onclick="ED.toggleMobileSidebar()"></div>

    <aside id="mobile-sidebar"
           class="fixed top-8 left-0 bottom-0 w-72 bg-surface-container-lowest z-50
                  shadow-xl transform -translate-x-full transition-transform duration-300 lg:hidden
                  flex flex-col overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-[#c4c6d0]">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-white text-[18px]">health_and_safety</span>
          </div>
          <span class="font-bold text-sm">E Doctor</span>
        </div>
        <button onclick="ED.toggleMobileSidebar()"
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1" id="mobile-sidebar-nav"></nav>
      <div class="px-4 py-4 border-t border-[#c4c6d0]" id="mobile-sidebar-user"></div>
    </aside>

  </div><!-- /app-shell -->

  <!-- ══ TOAST ════════════════════════════════════════════════════════════ -->
  <div id="toast"
       class="fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-[200]
              bg-[#1b1c1f] text-white text-sm font-medium px-5 py-3 rounded-xl shadow-xl
              transition-all duration-300 opacity-0 pointer-events-none whitespace-nowrap">
  </div>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
